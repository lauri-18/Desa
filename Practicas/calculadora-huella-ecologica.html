<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de huella ecológica</title>
<style>
  :root {
    --bg: #e8f0e6;
    --surface: #f7faf5;
    --ink: #14301f;
    --muted: #4d6555;
    --leaf: #2f6b3f;
    --leaf-dark: #1f4d2d;
    --water: #247a8a;
    --line: #c3d6c4;
    --error: #a5311f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1d15;
      --surface: #172a1f;
      --ink: #e4f0e5;
      --muted: #9db8a3;
      --leaf: #6cc080;
      --leaf-dark: #8fd6a0;
      --water: #5cc0d1;
      --line: #2c4635;
      --error: #f08a78;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }

  header { margin-bottom: 32px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 6vw, 3.1rem);
    line-height: 1.1;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  .lead {
    font-size: 1.1rem;
    max-width: 60ch;
    color: var(--muted);
    margin: 0;
  }
  .lead strong { color: var(--ink); }

  form { display: grid; gap: 20px; }
  fieldset {
    margin: 0;
    padding: 20px 20px 8px;
    border: 1px solid var(--line);
    border-left: 5px solid var(--leaf);
    border-radius: 6px;
    background: var(--surface);
  }
  fieldset.agua { border-left-color: var(--water); }
  legend {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 0 8px;
    margin-left: -8px;
  }
  .campo { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  select, input {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 3px solid var(--water);
    outline-offset: 2px;
  }
  .ayuda { font-size: 0.85rem; color: var(--muted); margin: 4px 0 0; }

  button {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 14px 24px;
    color: #fff;
    background: var(--leaf-dark);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  @media (prefers-color-scheme: dark) { button { color: #0f1d15; background: var(--leaf); } }
  button:hover:not(:disabled) { background: var(--leaf); }
  button:disabled { opacity: 0.6; cursor: wait; }

  #estado { min-height: 1.5em; margin: 0; font-weight: 600; color: var(--water); }
  #estado.error { color: var(--error); }

  #resultado {
    display: none;
    margin-top: 8px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--water);
    border-radius: 6px;
    white-space: pre-line;
    font-size: 1.05rem;
    overflow-wrap: anywhere;
  }
  #resultado.visible { display: block; }

  @media (min-width: 640px) {
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    button { transition: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Calculadora de huella ecológica</h1>
    <p class="lead">Si todas las personas del mundo vivieran como tú, <strong>¿cuántos planetas Tierra harían falta?</strong> Responde estas preguntas sobre tu día a día y descúbrelo.</p>
  </header>

  <form id="formulario" novalidate>
    <fieldset>
      <legend>Alimentación</legend>
      <div class="campo">
        <label for="carne">¿Cada cuánto comes carne de res o cerdo?</label>
        <select id="carne" name="carne" required>
          <option value="" disabled selected>Elige una opción</option>
          <option>Nunca</option>
          <option>1-2 veces por semana</option>
          <option>3-5 veces por semana</option>
          <option>Diario</option>
        </select>
      </div>
      <div class="campo">
        <label for="local">¿Qué parte de tu comida es local o de temporada?</label>
        <select id="local" name="local" required>
          <option value="" disabled selected>Elige una opción</option>
          <option>Casi nada</option>
          <option>La mitad</option>
          <option>Casi toda</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="agua">
      <legend>Transporte</legend>
      <div class="campo">
        <label for="transporte">Medio de transporte principal</label>
        <select id="transporte" name="transporte" required>
          <option value="" disabled selected>Elige una opción</option>
          <option>Caminar o bicicleta</option>
          <option>Camión urbano</option>
          <option>Moto</option>
          <option>Auto propio</option>
        </select>
      </div>
      <div class="fila">
        <div class="campo">
          <label for="km">Kilómetros que recorres al día</label>
          <input id="km" name="km" type="number" min="0" step="any" inputmode="decimal" placeholder="Ej. 12" required>
        </div>
        <div class="campo">
          <label for="vuelos">Vuelos en avión al año</label>
          <input id="vuelos" name="vuelos" type="number" min="0" step="1" inputmode="numeric" placeholder="Ej. 2" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Energía</legend>
      <div class="fila">
        <div class="campo">
          <label for="aire">Horas al día de aire acondicionado en casa</label>
          <input id="aire" name="aire" type="number" min="0" max="24" step="any" inputmode="decimal" placeholder="Ej. 6" required>
        </div>
        <div class="campo">
          <label for="personas">Personas que viven en tu casa</label>
          <input id="personas" name="personas" type="number" min="1" step="1" inputmode="numeric" placeholder="Ej. 4" required>
        </div>
      </div>
    </fieldset>

    <fieldset class="agua">
      <legend>Consumo</legend>
      <div class="fila">
        <div class="campo">
          <label for="ropa">Prendas nuevas que compras al mes</label>
          <input id="ropa" name="ropa" type="number" min="0" step="1" inputmode="numeric" placeholder="Ej. 2" required>
        </div>
        <div class="campo">
          <label for="celular">Cada cuántos años cambias de celular</label>
          <input id="celular" name="celular" type="number" min="0.5" step="any" inputmode="decimal" placeholder="Ej. 3" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Residuos</legend>
      <div class="campo">
        <label for="separa">¿Separas la basura?</label>
        <select id="separa" name="separa" required>
          <option value="" disabled selected>Elige una opción</option>
          <option>Sí</option>
          <option>A veces</option>
          <option>No</option>
        </select>
      </div>
    </fieldset>

    <button type="submit" id="boton">Calcular mi huella</button>
    <p id="estado" role="status" aria-live="polite"></p>
    <div id="resultado" aria-live="polite"></div>
  </form>
</main>

<script>
  // Pega aquí la URL del webhook de Make (módulo Custom webhook de tu escenario).
  const WEBHOOK_URL = "https://hook.us2.make.com/h82krnspox0exrixdls14t17nss8dhgh";

  const CAMPOS = ["carne", "local", "transporte", "km", "vuelos", "aire", "personas", "ropa", "celular", "separa"];

  const formulario = document.getElementById("formulario");
  const boton = document.getElementById("boton");
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  formulario.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!formulario.checkValidity()) {
      formulario.reportValidity();
      return;
    }

    const datos = new URLSearchParams();
    CAMPOS.forEach((nombre) => datos.append(nombre, formulario.elements[nombre].value));

    boton.disabled = true;
    estado.className = "";
    estado.textContent = "Calculando tu huella...";
    resultado.classList.remove("visible");
    resultado.textContent = "";

    try {
      const respuesta = await fetch(WEBHOOK_URL, { method: "POST", body: datos });
      if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
      const texto = await respuesta.text();

      estado.textContent = "";
      resultado.textContent = texto;
      resultado.classList.add("visible");
      resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (error) {
      estado.className = "error";
      estado.textContent = "No se pudo calcular, intenta de nuevo.";
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
